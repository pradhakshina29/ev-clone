<!DOCTYPE html>
<!-- Spotify sign-in redirect for the web build (flutter_web_auth_2). Register
     <app origin>/spotify_callback.html as a redirect URI in the Spotify
     Developer Dashboard. -->
<meta charset="utf-8">
<title>Spotify sign-in complete</title>
<p>Spotify sign-in is complete. If this window does not close by itself, close it and return to EV Smart Companion.</p>
<script>
  function postAuthenticationMessage() {
    const message = { 'flutter-web-auth-2': window.location.href };
    if (window.opener) {
      window.opener.postMessage(message, window.location.origin);
      window.close();
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage(message, window.location.origin);
    } else {
      localStorage.setItem('flutter-web-auth-2', window.location.href);
      window.close();
    }
  }
  postAuthenticationMessage();
</script>
